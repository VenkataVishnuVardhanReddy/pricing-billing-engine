databaseChangeLog:
  - changeSet:
      id: 1
      author: vishnu
      changes:
        - createTable:
            tableName: customer_balances
            columns:
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: balance
                  type: DECIMAL(10, 4)
              - column:
                  name: version
                  type: BIGINT
  - changeSet:
      id: 2
      author: vishnu
      changes:
        - createTable:
            tableName: pricing_plans
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: country_code
                  type: VARCHAR(10)
  - changeSet:
      id: 3
      author: vishnu
      changes:
        - createTable:
            tableName: pricing_rules
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: operator
                  type: VARCHAR(50)
              - column:
                  name: price
                  type: DECIMAL(10, 4)
              - column:
                  name: plan_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_pricing_rule_plan
                    references: pricing_plans(id)
